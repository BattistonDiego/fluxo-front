<span class="icone">
  <app-category-icon [nome]="visual().icone" [tamanho]="20" />
</span>

<span class="texto">
  <span class="descricao">{{ transacao().descricao }}</span>
  <span class="subtitulo">{{ textoSubtitulo() }}</span>
</span>

<span class="valor" [attr.data-tipo]="mostrarSinal() ? transacao().tipo : null">{{ sinal() }}{{ transacao().valor | moeda }}</span>
